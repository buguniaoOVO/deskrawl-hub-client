<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>桌破控制台</title>
  <link rel="icon" type="image/png" href="/client-icon.png">
  <link rel="stylesheet" href="/client.css">
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></symbol>
    <symbol id="i-loot" viewBox="0 0 24 24"><path d="M4 8.5 12 4l8 4.5v9L12 22l-8-4.5v-9Z"/><path d="m4.5 8.8 7.5 4.3 7.5-4.3M12 13v8.5M8.2 6.1l7.7 4.5"/></symbol>
    <symbol id="i-ops" viewBox="0 0 24 24"><path d="M13 2 4.8 13h6l-.5 9L19.5 10h-6L13 2Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3.1 1.3v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3.1-1.3l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-1.3-3.1h-.2a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 1.3-3.1l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3.1-1.3v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3.1 1.3l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 1.3 3.1h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-1.3 3.1Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9a6.5 6.5 0 0 1 10.8-2L20 12M4 12l3.1 5a6.5 6.5 0 0 0 10.8-2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7V5Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><path d="M7 8h10a4 4 0 0 1 3.8 2.8l1.1 3.5A3 3 0 0 1 17 17l-2-2H9l-2 2a3 3 0 0 1-4.9-2.7l1.1-3.5A4 4 0 0 1 7 8Z"/><path d="M8 10v4M6 12h4M16 11h.01M18 13h.01"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z"/><path d="M3.5 7.8 12 12l8.5-4.2M12 12v9M8 5l9 4.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2A10.5 10.5 0 0 1 12 6c6.2 0 9.5 6 9.5 6a15 15 0 0 1-3.2 3.7M6.1 6.9C3.8 8.4 2.5 12 2.5 12s3.3 6 9.5 6c1.2 0 2.3-.2 3.3-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 16l5-4-5-4M19 12H9"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.4 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.4 1.4-4.4-2.4-6-3m12 5v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.1-1.5 6.1-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.2-.4-3.8 1.4a13.2 13.2 0 0 0-6.9 0C5.4.1 4.2.5 4.2.5a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.1 6.4 6.1 6.7a3.4 3.4 0 0 0-.9 2.7V21"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15m6-12v15"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.6 7.4L21 12l-7.4 1.6L12 21l-1.6-7.4L3 12l7.4-2.6L12 2Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="/client-icon.png" alt=""></div>
        <div><div class="brand-name">桌破控制台</div><div class="brand-sub">LOCAL OPERATIONS</div></div>
      </div>

      <div class="nav-label">工作区</div>
      <nav class="nav-list" aria-label="主导航">
        <button class="nav-item active" data-view="overview"><svg><use href="#i-overview"/></svg><span>控制总览</span><kbd>01</kbd></button>
        <button class="nav-item" data-view="loot"><svg><use href="#i-loot"/></svg><span>掉落记录</span><kbd>02</kbd></button>
        <button class="nav-item" data-view="settings"><svg><use href="#i-settings"/></svg><span>运行设置</span><kbd>03</kbd></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="engine-state"><span class="state-led" id="side-led"></span><span id="side-state">正在连接</span></div>
        <div class="side-meta"><span>本机控制服务</span><span id="side-port">—</span></div>
        <div class="side-meta"><span>助手版本</span><span id="side-version">—</span></div>
      </div>
    </aside>

    <section class="main-area">
      <header class="topbar">
        <div class="crumb"><span>桌破</span><i>/</i><strong id="page-title">控制总览</strong></div>
        <div class="topbar-right">
          <div class="live-status"><span class="state-led" id="top-led"></span><span id="top-status">正在读取状态</span></div>
          <span class="top-divider"></span>
          <span class="top-time" id="top-time">--:--:--</span>
          <button class="icon-button sponsor-button" data-act="sponsor" title="赞助作者" aria-label="赞助作者"><svg><use href="#i-heart"/></svg></button>
          <button class="icon-button" id="github-button" data-act="github-open" title="GitHub 地址待配置" aria-label="GitHub 项目页" disabled><svg><use href="#i-github"/></svg></button>
          <button class="icon-button" id="refresh-button" title="刷新状态"><svg><use href="#i-refresh"/></svg></button>
          <button class="icon-button exit-button" data-act="exit-client" title="退出客户端" aria-label="退出客户端"><svg><use href="#i-exit"/></svg></button>
        </div>
      </header>

      <main id="page-root" class="page-root" aria-live="polite">
        <div class="loading-card"><span class="loader"></span><span>正在读取助手状态…</span></div>
      </main>
      <footer class="app-footer"><span>桌破中控</span><span class="footer-version">v1.0</span><span>by阿丸Awan</span></footer>
    </section>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/client.js"></script>
</body>
</html>
